<!-- ==========================================================================
     NagarWatch - Shared Component: Alert
     File: templates/components/alert.html
     Usage: {% include 'components/alert.html' with type='success' title='Saved' message='Issue submitted successfully' %}
     ========================================================================== -->
<div class="alert alert-{{ type|default:'info' }}" role="alert">
  <div class="alert-icon">
    {% if type == 'success' %}
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    {% elif type == 'warning' %}
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    {% elif type == 'danger' or type == 'error' %}
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
    {% else %}
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    {% endif %}
  </div>

  <div class="alert-content">
    {% if title %}<div class="alert-title">{{ title }}</div>{% endif %}
    <div>{{ message }}</div>
  </div>

  <button type="button" class="alert-close" aria-label="Dismiss alert" title="Dismiss alert">&times;</button>
</div>
