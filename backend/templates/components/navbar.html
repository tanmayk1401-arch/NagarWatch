{% load static %}
<!-- ==========================================================================
     NagarWatch - Shared Component: Navigation Bar
     File: templates/components/navbar.html
     Purpose: Top navigation for Resident and Admin views with responsive toggle
     ========================================================================== -->
<header class="site-header" id="top">
  <div class="container">
    <nav class="navbar" aria-label="Main Navigation">
      <!-- Brand Logo -->
      <a href="{% url 'resident_dashboard' %}" class="navbar-brand">
        <span class="brand-icon">N</span>
        <span>NagarWatch</span>
        <span class="brand-badge">PS 1.1</span>
      </a>

      <!-- Mobile Hamburger Button -->
      <button class="navbar-toggler" type="button" aria-expanded="false" aria-controls="navbarCollapse" aria-label="Toggle navigation">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <!-- Nav Links and Actions -->
      <div class="navbar-collapse" id="navbarCollapse">
        <ul class="navbar-nav">
          <li>
            <a href="{% url 'resident_dashboard' %}" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
              </svg>
              <span>Dashboard</span>
            </a>
          </li>
          <li>
            <a href="{% url 'explore_issues' %}" class="nav-link {% if active_page == 'explore' %}active{% endif %}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <span>Explore</span>
            </a>
          </li>
          <li>
            <a href="{% url 'report_issue' %}" class="nav-link {% if active_page == 'report' %}active{% endif %}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="16"></line>
                <line x1="8" y1="12" x2="16" y2="12"></line>
              </svg>
              <span>Report Issue</span>
            </a>
          </li>
          <li>
            <a href="{% url 'map_view' %}" class="nav-link {% if active_page == 'map' %}active{% endif %}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                <line x1="8" y1="2" x2="8" y2="18"></line>
                <line x1="16" y1="6" x2="16" y2="22"></line>
              </svg>
              <span>Map View</span>
            </a>
          </li>
          <li>
            <a href="{% url 'my_reports' %}" class="nav-link {% if active_page == 'my_reports' %}active{% endif %}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
              </svg>
              <span>My Reports</span>
            </a>
          </li>
          <li>
            <a href="{% url 'notifications' %}" class="nav-link {% if active_page == 'notifications' %}active{% endif %}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
              <span>Notifications</span>
            </a>
          </li>
        </ul>

        <div class="navbar-actions">
          <!-- View Switcher (Demonstration for Resident vs Admin) -->
          <div class="view-mode-toggle" title="Switch demonstration view">
            <a href="{% url 'resident_dashboard' %}" class="view-mode-btn {% if not is_admin %}active{% endif %}">Resident</a>
            <a href="{% url 'admin_dashboard' %}" class="view-mode-btn {% if is_admin %}active{% endif %}">Admin</a>
          </div>

          <!-- Auth Links Placeholder -->
          <a href="{% url 'login' %}" class="btn btn-sm btn-outline">Sign In</a>
        </div>
      </div>
    </nav>
  </div>
</header>
